org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 bringt eigenes Kotlin-Support mit und aktiviert die neue DSL. Wir bleiben
# beim Kotlin-Gradle-Plugin, weil Compose- und Serialization-Plugin daran haengen.
# TODO: vor AGP 10 auf built-in Kotlin migrieren (https://kotl.in/gradle/agp-built-in-kotlin).
android.builtInKotlin=false
android.newDsl=false
